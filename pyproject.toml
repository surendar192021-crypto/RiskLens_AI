[project]
name = "risklens-ai"
version = "0.1.0"
description = "AI-driven loan portfolio risk monitoring and early warning with explainable ML"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
